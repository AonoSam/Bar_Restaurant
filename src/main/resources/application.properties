spring.application.name=bar_restaurant

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:43200000}

# First-run manager account - only created if no employees exist yet
app.bootstrap.manager-username=${BOOTSTRAP_MANAGER_USERNAME:}
app.bootstrap.manager-password=${BOOTSTRAP_MANAGER_PASSWORD:}

#server.address=0.0.0.0
server.port=${PORT:8080}


# --- M-Pesa Daraja ---
# Sandbox: https://sandbox.safaricom.co.ke | Production: https://api.safaricom.co.ke
mpesa.base-url=${MPESA_BASE_URL:}
mpesa.consumer-key=${MPESA_CONSUMER_KEY:}
mpesa.consumer-secret=${MPESA_CONSUMER_SECRET:}
mpesa.shortcode=${MPESA_SHORTCODE:}
mpesa.passkey=${MPESA_PASSKEY:}

mpesa.callback-url=${MPESA_CALLBACK_URL:}

logging:
level:
org.springframework.security: DEBUG